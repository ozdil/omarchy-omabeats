[package]
name = "omabeats-engine"
version = "1.0.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Comprehensive Apple Beats headphones control and battery monitor engine for Omarchy Linux"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
